<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- IMPORTANT FOR MOBILE -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Robobuoy Docking Dashboard</title>

<style>

/* =========================================================
   GLOBAL
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, sans-serif;
    background: #e6e6e6;
    text-align: center;
    margin: 0;
    padding: 20px;
    overflow-x: hidden;
}


/* =========================================================
   TABS
   ========================================================= */

.tab {
    overflow-x: auto;
    white-space: nowrap;

    border: 1px solid #ccc;
    background-color: #f1f1f1;

    margin-bottom: 20px;

    -webkit-overflow-scrolling: touch;
}

.tab button {
    float: none;
    display: inline-block;

    border: none;
    padding: 14px 16px;

    cursor: pointer;
    background: inherit;

    font-size: 16px;
}

.tab button.active {
    background: #ccc;
}


/* =========================================================
   MAIN LAYOUT
   ========================================================= */

.wrapper {
    display: flex;

    justify-content: center;
    align-items: flex-start;

    gap: 40px;

    width: 100%;
}


/* =========================================================
   SIDE PANELS
   ========================================================= */

.side-panel {
    width: 120px;
    flex: 0 0 120px;

    padding: 10px;

    background: #f4f4f4;

    border: 1px solid #999;
    border-radius: 10px;
}

.side-bar {
    width: 40px;
    height: 300px;

    margin: 5px auto;

    background: #dcdcdc;

    border: 1px solid #777;
    border-radius: 6px;

    position: relative;

    overflow: hidden;
}

.zero-line {
    position: absolute;

    width: 100%;
    height: 2px;

    background: black;

    top: 50%;
}

.bar-positive {
    position: absolute;

    width: 100%;

    background: green;

    bottom: 50%;
}

.bar-negative {
    position: absolute;

    width: 100%;

    background: red;

    top: 50%;
}

.valueText {
    font-size: 18px;
    font-weight: bold;
}


/* =========================================================
   COMPASS
   ========================================================= */

.compassCircle {
    width: min(250px, 70vw);
    height: min(250px, 70vw);

    border: 3px solid black;
    border-radius: 50%;

    margin: auto;

    position: relative;
}

#compassCanvas {
    width: 100%;
    height: 100%;

    display: block;
}

.dirLabel {
    position: absolute;

    font-weight: bold;
    font-size: 18px;
}

.n {
    top: -5px;
    left: 50%;

    transform: translateX(-50%);
}

.s {
    bottom: -5px;
    left: 50%;

    transform: translateX(-50%);
}

.e {
    right: -5px;
    top: 50%;

    transform: translateY(-50%);
}

.w {
    left: -5px;
    top: 50%;

    transform: translateY(-50%);
}


/* =========================================================
   BATTERY
   ========================================================= */

.battery {
    width: 200px;
    max-width: 45vw;

    height: 20px;

    background: #ccc;

    border-radius: 6px;
    border: 1px solid #777;

    margin: auto;

    position: relative;

    overflow: hidden;
}

.batteryFill {
    position: absolute;

    left: 0;
    top: 0;

    height: 100%;

    background: green;
}


/* =========================================================
   BUTTONS
   ========================================================= */

button {
    padding: 8px 20px;

    margin: 5px;

    font-size: 16px;

    cursor: pointer;
}


/* =========================================================
   INPUTS
   ========================================================= */

.inputRow {
    margin-top: 10px;
}

.inputRow input {
    width: 95px;

    padding: 8px;

    font-size: 16px;
}


/* =========================================================
   TABLET / MOBILE
   ========================================================= */

@media (max-width: 700px) {

    body {
        padding: 8px;
    }


    /* -------------------------
       TITLE
       ------------------------- */

    h1 {
        font-size: 24px;

        margin: 10px 0;
    }


    /* -------------------------
       MAIN 3-COLUMN LAYOUT

       BB | COMPASS | SB
       ------------------------- */

    .wrapper {
        display: grid;

        grid-template-columns:
            50px
            minmax(0, 1fr)
            50px;

        gap: 5px;

        align-items: center;

        width: 100%;
    }


    /* -------------------------
       SIDE PANELS
       ------------------------- */

    .side-panel {
        width: 50px;
        min-width: 0;

        padding: 4px 2px;

        flex: none;

        border-radius: 6px;

        font-size: 12px;
    }

    .side-bar {
        width: 24px;
        height: 180px;

        margin: 4px auto;
    }

    .valueText {
        font-size: 14px;

        white-space: nowrap;
    }


    /* -------------------------
       CENTER PANEL
       ------------------------- */

    .wrapper > div:nth-child(2) {
        min-width: 0;

        width: 100%;
    }


    /* -------------------------
       DISTANCE / INTERVAL
       ------------------------- */

    #distanceText,
    #intervalText {
        font-size: clamp(18px, 6vw, 28px) !important;
    }


    /* -------------------------
       COMPASS
       ------------------------- */

    .compassCircle {
        width: min(250px, 65vw);
        height: min(250px, 65vw);
    }

    .dirLabel {
        font-size: 15px;
    }


    /* -------------------------
       BATTERY
       ------------------------- */

    .battery {
        width: 120px;
        max-width: 35vw;

        height: 18px;
    }


    /* -------------------------
       VOLTAGE TEXT
       ------------------------- */

    .wrapper > div:nth-child(2)
        > div:nth-of-type(2)
        span {

        font-size: 14px;
    }


    /* -------------------------
       COMPASS LEGEND
       ------------------------- */

    .wrapper > div:nth-child(2)
        > div:last-child {

        font-size: 12px;

        white-space: nowrap;
    }


    /* -------------------------
       BUTTONS
       ------------------------- */

    button {
        padding: 9px 14px;

        margin: 3px;

        font-size: 15px;
    }


    /* -------------------------
       INPUT ROW
       ------------------------- */

    .inputRow {
        display: grid;

        grid-template-columns:
            auto
            1fr
            auto
            1fr;

        align-items: center;

        gap: 4px;

        margin-top: 10px;
    }

    .inputRow input {
        width: 100%;

        min-width: 0;

        padding: 8px 5px;
    }

    .inputRow button {
        width: 100%;

        margin: 2px;
    }
}


/* =========================================================
   SMALL PHONES
   ========================================================= */

@media (max-width: 400px) {

    body {
        padding: 5px;
    }


    .wrapper {
        grid-template-columns:
            42px
            minmax(0, 1fr)
            42px;

        gap: 3px;
    }


    .side-panel {
        width: 42px;
    }


    .side-bar {
        width: 20px;
        height: 150px;
    }


    .valueText {
        font-size: 12px;
    }


    .compassCircle {
        width: min(220px, 64vw);
        height: min(220px, 64vw);
    }


    .dirLabel {
        font-size: 13px;
    }


    button {
        padding: 8px 10px;

        font-size: 14px;
    }
}


/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

@media (max-width: 340px) {

    .wrapper {
        grid-template-columns:
            36px
            minmax(0, 1fr)
            36px;

        gap: 2px;
    }


    .side-panel {
        width: 36px;
    }


    .side-bar {
        width: 18px;
        height: 130px;
    }


    .valueText {
        font-size: 11px;
    }


    .compassCircle {
        width: min(200px, 62vw);
        height: min(200px, 62vw);
    }


    .dirLabel {
        font-size: 12px;
    }


    .battery {
        width: 100px;
    }


    button {
        padding: 7px 8px;

        font-size: 13px;
    }
}

</style>
</head>


<body>


<!-- =========================================================
     TABS
     ========================================================= -->

<div class="tab">

    <button
        onclick="openTab(1)"
        id="btn_buoy1">
        Buoy 1
    </button>

    <button
        onclick="openTab(2)"
        id="btn_buoy2">
        Buoy 2
    </button>

    <button
        onclick="openTab(3)"
        id="btn_buoy3">
        Buoy 3
    </button>

</div>


<!-- =========================================================
     TITLE
     ========================================================= -->

<h1 id="title">
    WAITING...
</h1>


<!-- =========================================================
     MAIN DASHBOARD
     ========================================================= -->

<div class="wrapper">


    <!-- =====================
         BB
         ===================== -->

    <div class="side-panel">

        <div>
            BB
        </div>

        <div
            class="side-bar"
            id="barBB">

            <div class="zero-line"></div>

        </div>

        <div
            id="bbValue"
            class="valueText">

            0%

        </div>

    </div>


    <!-- =====================
         CENTER
         ===================== -->

    <div>


        <!-- Distance / interval -->

        <div
            style="
                display:flex;
                justify-content:space-between;
                align-items:center;
            ">

            <span
                id="distanceText"
                style="
                    font-size:28px;
                    color:red;
                    font-weight:bold;
                ">

                0m

            </span>


            <span
                id="intervalText"
                style="
                    font-size:28px;
                    color:purple;
                    font-weight:bold;
                ">

                I:0

            </span>

        </div>


        <!-- =====================
             COMPASS
             ===================== -->

        <div class="compassCircle">

            <canvas
                id="compassCanvas"
                width="250"
                height="250">
            </canvas>


            <div class="dirLabel n">
                N
            </div>

            <div class="dirLabel s">
                S
            </div>

            <div class="dirLabel e">
                E
            </div>

            <div class="dirLabel w">
                W
            </div>

        </div>


        <!-- =====================
             BATTERY
             ===================== -->

        <div
            style="
                display:flex;
                gap:10px;
                align-items:center;
                justify-content:center;
                margin-top:10px;
            ">

            <span>
                17V
            </span>


            <div class="battery">

                <div
                    id="batteryFill"
                    class="batteryFill">
                </div>

            </div>


            <span>
                25V
            </span>

        </div>


        <!-- =====================
             LEGEND
             ===================== -->

        <div style="margin-top:10px;">

            <span style="color:red;">
                ■ Target
            </span>

            <span style="color:green;">
                ■ Mag
            </span>

            <span style="color:blue;">
                ■ Wind
            </span>

            <span style="color:black;">
                ■ GPS
            </span>

        </div>


    </div>


    <!-- =====================
         SB
         ===================== -->

    <div class="side-panel">

        <div>
            SB
        </div>


        <div
            class="side-bar"
            id="barSB">

            <div class="zero-line"></div>

        </div>


        <div
            id="sbValue"
            class="valueText">

            0%

        </div>

    </div>


</div>


<!-- =========================================================
     CONTROL BUTTONS
     ========================================================= -->

<div style="margin-top:20px;">

    <button id="btnLock">
        LOCK
    </button>

    <button id="btnDock">
        DOCK
    </button>

    <button>
        SETUP
    </button>

</div>


<!-- =========================================================
     INPUT CONTROLS
     ========================================================= -->

<div class="inputRow">

    <span>
        Dir
    </span>

    <input
        id="inDir"
        type="number">


    <span>
        Dist
    </span>

    <input
        id="inDist"
        type="number">


    <button>
        Send
    </button>

    <button>
        Map
    </button>

</div>


<script>

/* =========================================================
   DATA
   ========================================================= */

let currentBuoy = 1;

let buoyData = {};


/* =========================================================
   TABS
   ========================================================= */

function openTab(id) {

    currentBuoy = id;


    document
        .querySelectorAll(".tab button")
        .forEach(function(button) {

            button.classList.remove("active");

        });


    document
        .getElementById("btn_buoy" + id)
        .classList.add("active");


    updateUI();
}


/* =========================================================
   SIDE BARS
   ========================================================= */

function setBar(barId, value, textId) {

    const bar =
        document.getElementById(barId);


    /* Remove previous bars */

    bar
        .querySelectorAll(
            ".bar-positive,.bar-negative"
        )
        .forEach(function(element) {

            element.remove();

        });


    const half = 150;


    let h =
        Math.min(
            Math.abs(value),
            100
        ) * (half / 100);


    /* Positive */

    if (value > 0) {

        let p =
            document.createElement("div");


        p.className =
            "bar-positive";


        p.style.height =
            h + "px";


        bar.appendChild(p);

    }


    /* Negative */

    else if (value < 0) {

        let n =
            document.createElement("div");


        n.className =
            "bar-negative";


        n.style.height =
            h + "px";


        bar.appendChild(n);

    }


    document
        .getElementById(textId)
        .innerText =
        value + "%";
}


/* =========================================================
   COMPASS
   ========================================================= */

function drawCompass(
    heading,
    target,
    mag,
    wind,
    gps
) {

    const canvas =
        document.getElementById(
            "compassCanvas"
        );


    const ctx =
        canvas.getContext("2d");


    const size =
        canvas.width;


    const center =
        size / 2;


    const radius =
        center * 0.8;


    ctx.clearRect(
        0,
        0,
        size,
        size
    );


    /* Outer compass circle */

    ctx.beginPath();

    ctx.arc(
        center,
        center,
        radius,
        0,
        2 * Math.PI
    );

    ctx.strokeStyle = "#bbb";

    ctx.lineWidth = 1;

    ctx.stroke();


    /* Arrow function */

    function arrow(
        angle,
        color,
        length,
        width
    ) {

        if (
            angle === undefined ||
            angle === null ||
            isNaN(angle)
        ) {
            return;
        }


        let a =
            (angle - 90) *
            Math.PI /
            180;


        let len =
            radius * length;


        let x =
            center +
            len *
            Math.cos(a);


        let y =
            center +
            len *
            Math.sin(a);


        /* Line */

        ctx.beginPath();

        ctx.lineWidth = width;

        ctx.strokeStyle = color;

        ctx.moveTo(
            center,
            center
        );

        ctx.lineTo(
            x,
            y
        );

        ctx.stroke();


        /* Arrow head */

        let headLength =
            Math.max(
                8,
                width * 4
            );


        let angle1 =
            a + Math.PI * 0.85;


        let angle2 =
            a - Math.PI * 0.85;


        ctx.beginPath();

        ctx.fillStyle = color;

        ctx.moveTo(
            x,
            y
        );

        ctx.lineTo(
            x +
            headLength *
            Math.cos(angle1),

            y +
            headLength *
            Math.sin(angle1)
        );

        ctx.lineTo(
            x +
            headLength *
            Math.cos(angle2),

            y +
            headLength *
            Math.sin(angle2)
        );

        ctx.closePath();

        ctx.fill();

    }


    /* Magnetic direction */

    arrow(
        mag,
        "green",
        0.9,
        3
    );


    /* Wind direction */

    arrow(
        wind,
        "blue",
        0.7,
        2
    );


    /* GPS direction */

    arrow(
        gps,
        "black",
        0.8,
        2
    );


    /* Target direction */

    arrow(
        target,
        "red",
        1.0,
        4
    );

}


/* =========================================================
   UPDATE UI
   ========================================================= */

function updateUI() {

    const b =
        buoyData[currentBuoy];


    if (!b) {
        return;
    }


    /* BB */

    setBar(
        "barBB",
        parseFloat(b.BB || 0),
        "bbValue"
    );


    /* SB */

    setBar(
        "barSB",
        parseFloat(b.SB || 0),
        "sbValue"
    );


    /* Distance */

    document
        .getElementById(
            "distanceText"
        )
        .innerText =
        (b.TgDist || 0) + "m";


    /* Interval */

    document
        .getElementById(
            "intervalText"
        )
        .innerText =
        "I:" + (b.PIDI || 0);


    /* Battery */

    let battery =
        parseFloat(
            b.SubPerc || 0
        );


    battery =
        Math.max(
            0,
            Math.min(
                100,
                battery
            )
        );


    document
        .getElementById(
            "batteryFill"
        )
        .style.width =
        battery + "%";


    /* Compass */

    drawCompass(

        b.MagDir,

        b.TgDir,

        b.MagDir,

        b.WDir,

        b.GpsDir

    );

}


/* =========================================================
   FETCH DATA
   ========================================================= */

function fetchData() {

    fetch("/data")

        .then(function(response) {

            if (!response.ok) {

                throw new Error(
                    "HTTP error " +
                    response.status
                );

            }

            return response.json();

        })

        .then(function(data) {

            if (
                !data ||
                !Array.isArray(data.buoys)
            ) {
                return;
            }


            data.buoys.forEach(
                function(b, i) {

                    buoyData[i + 1] = b;

                }
            );


            updateUI();

        })

        .catch(function(error) {

            console.log(
                "Data error:",
                error
            );

        });

}


/* =========================================================
   START
   ========================================================= */

window.onload = function() {

    openTab(1);

    fetchData();

};


/* =========================================================
   REFRESH EVERY 2 SECONDS
   ========================================================= */

setInterval(
    fetchData,
    2000
);

</script>

</body>
</html>
